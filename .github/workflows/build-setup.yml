name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

concurrency:
  group: build-setup
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build setup.exe (NSIS installer)
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis --x64 --publish never 2>&1 | tee build-log.txt

      - name: Commit installer to this branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/AI-Chat-Server-Setup-*.exe
          git commit -m "CI: build setup.exe installer [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Commit build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-log.txt
          git commit -m "CI: electron-builder failed - build log [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
