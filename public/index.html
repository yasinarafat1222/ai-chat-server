<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Server</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#7c6cff"></rect>
            <path d="M16 20h32a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H30l-10 8v-8h-4a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z" fill="#fff"></path>
            <circle cx="24" cy="32" r="3" fill="#7c6cff"></circle>
            <circle cx="34" cy="32" r="3" fill="#7c6cff"></circle>
            <circle cx="44" cy="32" r="3" fill="#7c6cff"></circle>
          </svg>
        </div>
        <div>
          <h1>AI Chat Server</h1>
          <p id="status" class="status">সার্ভার চলছে…</p>
        </div>
      </div>
      <div class="actions">
        <button id="clearBtn" class="icon-btn" title="চ্যাট পরিষ্কার করুন">🧹</button>
        <button id="settingsBtn" class="icon-btn" title="সেটিংস">⚙️</button>
      </div>
    </header>

    <main id="chat" class="chat">
      <div class="msg bot">
        <div class="bubble welcome">
          <strong>স্বাগতম! 👋</strong><br>
          এটি আপনার AI চ্যাট অ্যাসিস্ট্যান্ট। নিচে মেসেজ লিখে Enter চাপুন।<br>
          <span class="dim">প্রথমবার ব্যবহার করলে ⚙️ সেটিংসে গিয়ে Gemini API Key দিন।</span>
        </div>
      </div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="মেসেজ লিখুন…  (Enter = পাঠান, Shift+Enter = নতুন লাইন)"></textarea>
      <button type="submit" id="sendBtn">পাঠান ➤</button>
    </form>
  </div>

  <div class="modal-backdrop hidden" id="settingsModal">
    <div class="modal">
      <h2>⚙️ সেটিংস</h2>
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIza..." spellcheck="false" />
      <p class="hint">
        কী (key) পাবেন <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>-তে।
        কী শুধু আপনার কম্পিউটারেই (localStorage) সংরক্ষিত থাকে।
      </p>

      <label for="systemPrompt">System Prompt (AI-এর ভূমিকা)</label>
      <textarea id="systemPrompt" rows="3" placeholder="যেমন: তুমি একজন বন্ধুত্বপূর্ণ কাস্টমার সার্ভিস এজেন্ট…"></textarea>

      <label for="knowledge">Knowledge Base (আপনার তথ্য)</label>
      <textarea id="knowledge" rows="5" placeholder="যেমন: আমাদের দোকানের ঠিকানা, দাম, নিয়ম-কানুন…"></textarea>

      <div class="modal-actions">
        <button type="button" id="closeSettings">বন্ধ</button>
        <button type="button" id="saveSettings" class="primary">সেভ করুন</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
